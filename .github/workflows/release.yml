name: Skill release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag; use a prerelease suffix while acceptance gates remain open
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skills-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Validate the requested version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "An existing vMAJOR.MINOR.PATCH[-prerelease] tag is required" >&2
            exit 1
          fi
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag identity and trusted ancestry
        run: |
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare local resource closures
        run: python scripts/build_skills.py --prepare
      - name: Verify manifest and distribution contracts
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_skills.py
      - name: Build the versioned archive and enforce qualification
        run: |
          arguments=()
          if [[ "$RELEASE_TAG" == *-* ]]; then arguments+=(--prerelease); fi
          python scripts/build_skills.py --release "${arguments[@]}" \
            --version "$RELEASE_TAG" --output "dist/skills-$RELEASE_TAG.zip"
      - name: Write release notes
        run: |
          cat > dist/release-notes.md <<'EOF'
          Download the skill zip and companion checksum, open the target project,
          and ask its agent: "install the skills in this zip file."

          The archive contains scoped installation instructions, a complete manifest,
          an auditable installer, all parent/legacy resources and qualification status.
          Installation is project-local and does not execute any skill workflow.

          Prereleases may have unperformed host/model-quality acceptance gates.
          Inspect qualification metadata; packaging tests do not certify model quality.
          EOF
      - name: Attach assets to a draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published or draft assets" >&2
            exit 1
          fi
          arguments=()
          if [[ "$RELEASE_TAG" == *-* ]]; then arguments+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft "${arguments[@]}" --title "Skills $RELEASE_TAG" --notes-file dist/release-notes.md
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "dist/skills-$RELEASE_TAG.zip" "dist/skills-$RELEASE_TAG.zip.sha256"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
